services:
  db:
    image: postgres:17-alpine
    container_name: printer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-printer_mps}
      POSTGRES_USER: ${DB_USERNAME:-printer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-printer}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-printer} -d ${DB_DATABASE:-printer_mps}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: printer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
